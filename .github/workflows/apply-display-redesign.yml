name: Apply Spectator Display Redesign

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: startsWith(github.event.issue.title, '[scoreboard-redesign]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch original controller to load display redesign
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="display-redesign.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in index.html')
              text = text.replace(marker, f'    {tag}\n{marker}', 1)
              p.write_text(text, encoding='utf-8')
          else:
              print('Display redesign already linked.')

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Update spectator standings, results and schedule displays'
            git push
          fi

      - name: Close request issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --comment 'Spectator display redesign applied to index.html. The original controller logic remains unchanged.'
