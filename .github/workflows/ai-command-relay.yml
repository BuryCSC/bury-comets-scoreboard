name: AI command relay

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

jobs:
  relay:
    if: github.event.issue.number == 1 && github.event.comment.user.login == 'BuryCSC'
    runs-on: ubuntu-latest
    steps:
      - name: Parse and publish command
        uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_UPDATED_AT: ${{ github.event.comment.updated_at }}
        with:
          script: |
            const body = process.env.COMMENT_BODY || '';
            const m = body.match(/```(?:json)?\s*([\s\S]*?)\s*```/i) || body.match(/AI_COMMAND\s*:\s*([\s\S]*)/i);
            if (!m) {
              core.info('No AI command found; nothing to relay.');
              return;
            }

            let command;
            try {
              command = JSON.parse(m[1]);
            } catch (err) {
              core.setFailed(`Invalid AI command JSON: ${err.message}`);
              return;
            }

            const payload = {
              id: Number(process.env.COMMENT_ID),
              updatedAt: process.env.COMMENT_UPDATED_AT || new Date().toISOString(),
              command
            };

            const path = 'ai-command.json';
            const content = Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: context.payload.repository.default_branch
              });
              sha = existing.data.sha;
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `Relay AI command ${process.env.COMMENT_ID}`,
              content,
              branch: context.payload.repository.default_branch,
              ...(sha ? { sha } : {})
            });

            core.info(`Relayed AI command ${process.env.COMMENT_ID}: ${JSON.stringify(command)}`);